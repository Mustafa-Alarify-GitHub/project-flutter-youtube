name: ww
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.8.2
  chewie: ^1.8.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/config.json
    - assets/shorts.json
    - assets/series.json
    - assets/images/
    - assets/icon.png
    - assets/videos/series/
    - assets/videos/series/spy/
    - assets/videos/reels/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
