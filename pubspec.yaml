name: ww
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # تم إزالة علامة ^ وتخفيض الإصدارات لتتوافق مع Android SDK 34
  video_player: 2.8.3
  chewie: 1.8.0
  path_provider: 2.1.2
  permission_handler: 11.3.1
  flutter_riverpod: 2.5.1
  shared_preferences: 2.2.3
  intl: 0.20.2
  photo_manager: 2.8.1
  photo_manager_image_provider: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.0
  flutter_launcher_icons: 0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/config.json
    - assets/shorts.json
    - assets/series.json
    - assets/images/
    - assets/icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21